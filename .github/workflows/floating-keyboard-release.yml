name: Build and release floating keyboard APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 37
        run: |
          echo "SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'platform-tools'

      - name: Compile debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thumb-key-floating-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create a GitHub release with downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: floating-v1.0.${{ github.run_number }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Thumb-Key Floating $RELEASE_TAG" \
            --notes "Floating keyboard mode with draggable overlay and draw-over-other-apps permission. This is a debug-signed APK for testing, not an official upstream release." \
            --target "$RELEASE_SHA"
